[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "familyos-client"
version = "0.1.0"
description = "Async Python client for the FamilyOS public API (calendar, lists, chores, board)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Onur Ceri" }]
keywords = ["familyos", "home-assistant", "calendar", "api-client", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9", "mashumaro>=3.13"]

[project.urls]
Homepage = "https://github.com/onurceri/familyos-client"
Issues = "https://github.com/onurceri/familyos-client/issues"

[dependency-groups]
dev = [
  "aioresponses>=0.7.6",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["familyos"]

[tool.hatch.build.targets.sdist]
include = ["familyos", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=familyos --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["integration: needs a running FamilyOS (FAMOS_URL and FAMOS_TOKEN)"]

[tool.coverage.run]
omit = ["familyos/__init__.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "A"]
# ConnectionError and TimeoutError are the library's own names for its errors, on purpose.
ignore = ["A004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["A001", "A002"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["familyos", "tests"]
